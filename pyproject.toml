[project]
name = "nuclease-design"
version = "0.0.1"
description = "PLM-guided redesign of FnCas9 toward an enFnCas9-class improved nuclease"
requires-python = ">=3.10"
readme = "README.md"

dependencies = [
    # Core scientific stack
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "pyarrow>=14",
    "pydantic>=2.5",
    "pyyaml>=6",

    # Protein I/O and structure
    "biotite>=0.40",
    "biopython>=1.83",

    # ML — torch CPU is the default; install CUDA/MPS torch separately if needed
    "torch>=2.2",
    "transformers>=4.40",
    "accelerate>=0.30",

    # ESM-2 via fair-esm (lightweight, deterministic). Latest on PyPI is 2.0.0.
    "fair-esm>=2.0.0",

    # Plotting and reporting
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "tqdm>=4.66",

    # CLI
    "click>=8.1",
    "rich>=13.7",
]

[project.optional-dependencies]
# Heavy deps that user installs only when running the corresponding stage
esm3 = [
    "esm>=3.0",  # EvolutionaryScale ESM-3, gated on HF
]
fold = [
    # Pick one of: boltz, chai-1, or colabfold depending on local resources
    "boltz>=0.3",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "mypy>=1.10",
    "ruff>=0.4",
    "ipykernel>=6.29",
]

[project.scripts]
nuclease-design = "nuclease_design.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nuclease_design"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/nuclease_design"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests that download weights or run model inference (deselect with '-m \"not slow\"')",
]
